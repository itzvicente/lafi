<!-- VISTA 1: LOGIN -->
<div id="view-login" class="view active">
  <div class="card-auth">
    <h1 class="brand-title">LAFI</h1>
    <p class="brand-subtitle">DROGUERÍA Y BIENESTAR</p>
    <h2>Iniciar Sesión</h2>
    
    <!-- Mensaje de error / éxito para Login -->
    <div id="login-msg" class="auth-message hidden"></div>

    <form id="form-login">
      <div class="input-group">
        <label for="login-email">Ingrese su gmail</label>
        <input type="email" id="login-email" placeholder="usuario@gmail.com" required>
      </div>
      
      <div class="input-group">
        <label for="login-password">Ingrese su contraseña</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>

      <div class="auth-links">
        <a href="#" class="link-forgot">¿Olvidaste la contraseña?</a>
      </div>
      
      <button type="submit" class="btn-primary">INICIAR SESIÓN</button>
    </form>
    
    <p class="switch-auth">¿No tienes cuenta? <button type="button" class="btn-link" id="go-to-register">Regístrate acá</button></p>
  </div>
</div>

<!-- VISTA 2: REGISTRO -->
<div id="view-register" class="view hidden">
  <div class="card-auth">
    <h1 class="brand-title">LAFI</h1>
    <p class="brand-subtitle">DROGUERÍA Y BIENESTAR</p>
    <h2>Registrarse</h2>
    
    <!-- Mensaje de error / éxito para Registro -->
    <div id="register-msg" class="auth-message hidden"></div>

    <form id="form-register">
      <div class="input-group">
        <label for="reg-name">Nombre completo</label>
        <input type="text" id="reg-name" placeholder="Juan Pérez" required>
      </div>
      
      <div class="input-group">
        <label for="reg-email">Correo electrónico</label>
        <input type="email" id="reg-email" placeholder="usuario@gmail.com" required>
      </div>

      <div class="input-group">
        <label for="reg-phone">Teléfono</label>
        <input type="tel" id="reg-phone" placeholder="+54 11 11111111" required>
      </div>

      <div class="input-group">
        <label for="reg-address">Dirección de sucursal</label>
        <input type="text" id="reg-address" placeholder="Av. Siempre Viva 123" required>
      </div>
      
      <div class="input-group">
        <label for="reg-pass">Ingrese la contraseña</label>
        <input type="password" id="reg-pass" placeholder="••••••••" required>
      </div>

      <div class="input-group">
        <label for="reg-pass-confirm">Confirme la contraseña</label>
        <input type="password" id="reg-pass-confirm" placeholder="••••••••" required>
      </div>
      
      <button type="submit" class="btn-primary">REGISTRARSE</button>
    </form>
    
    <p class="switch-auth">¿Ya tienes una cuenta? <button type="button" class="btn-link" id="go-to-login">Inicia sesión acá</button></p>
  </div>
</div>
